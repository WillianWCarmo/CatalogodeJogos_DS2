{% extends "base.html" %}

{% block content %}

<h1>Contato</h1>

<p>
    Entre em contato conosco através do formulário abaixo.
</p>

<form method="POST" class="formulario">

    <label for="nome">
        Nome:
    </label>

    <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome"
    >

    <label for="email">
        E-mail:
    </label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
    >

    <label for="mensagem">
        Mensagem:
    </label>

    <textarea
        id="mensagem"
        name="mensagem"
        placeholder="Digite sua mensagem"
    ></textarea>

    <button type="submit">
        Enviar
    </button>

</form>

{% endblock %}
